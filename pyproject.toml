[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simplexlora-bench"
version = "0.1.0"
description = "Isolated, auditable 8-bit LoRA classification experiments"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.9.0", "transformers==4.57.1", "peft==0.17.1",
  "accelerate==1.11.0", "datasets==4.3.0", "huggingface-hub==0.36.0",
  "scikit-learn==1.7.2", "numpy==2.2.6", "safetensors==0.6.2",
]

[project.optional-dependencies]
gpu = ["bitsandbytes==0.48.1"]
test = ["pytest==8.4.2"]

[project.scripts]
simplex-bench = "simplexbench.cli:main"

[tool.setuptools.packages.find]
include = ["simplexbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires a real CUDA GPU and bitsandbytes"]
