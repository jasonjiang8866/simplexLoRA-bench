name: Publish reviewed gradient decision
on:
  workflow_dispatch:
    inputs:
      experiment:
        type: choice
        options: [legacy, dora]
        default: legacy
  push:
    branches: [main]
    paths: ['docs/results/diagnosis-review.json']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Normalize review artifact filename
        env:
          REVIEW_SOURCE: ${{ inputs.experiment == 'dora' && 'docs/results/dora-diagnosis-review.json' || 'docs/results/diagnosis-review.json' }}
        run: |
          mkdir -p review-artifact
          cp "$REVIEW_SOURCE" review-artifact/diagnosis-review.json
      - uses: actions/upload-artifact@v4
        with:
          name: diagnosis-review
          path: review-artifact/diagnosis-review.json
          if-no-files-found: error
          retention-days: 90
